}
function subjectDone(i){return DATA[i].lectures.filter((l,j)=>state.done.includes(i+'-'+j)).length}

function subjectsPage(){

function lessonPage(si,li){

 app.innerHTML=`<div class="backrow"><button class="btn secondary" onclick="openSubject(${si})">← محاضرات المادة</button><button class="btn secondary" onclick="questionBank(${si},${li})">انتقل إلى الأسئلة</button></div>
 <article class="card content"><span class="pill">${esc(s.name)} • المحاضرة ${li+1} من 10</span><h2>${esc(l.title)}</h2>

 <h3>ثانيًا: الشرح العلمي والمفاهيم الأساسية</h3><p>لفهم هذا الموضوع، من المهم التمييز بين التعريف والمبدأ وطريقة التطبيق. التعريف يحدد معنى المصطلح، والمبدأ يوضح العلاقة أو القاعدة التي تحكمه، أما التطبيق فيبيّن كيف نستخدم هذه القاعدة في موقف محدد.</p>
 <p>${esc(l.goal)} لا يكفي حفظ التعريف وحده؛ ينبغي أن تكون قادرًا على شرح الفكرة بكلماتك، وتحديد عناصرها، وربطها بمثال، وبيان سبب اختيار طريقة الحل.</p>
 <h3>مصطلحات مهمة</h3>${l.terms.map(t=>`<div class="term">${esc(t)}</div>`).join('')}

 <div class="callout example"><strong>مثال تطبيقي:</strong><p>${esc(l.example)}</p><strong>طريقة التفكير:</strong> نحدد المعطيات أولًا، ثم نختار القاعدة المناسبة، وننفذها، وأخيرًا نراجع النتيجة. قد تختلف تفاصيل التطبيق بحسب بيانات السؤال الفعلية.</div>
 <h3>رابعًا: أخطاء شائعة وكيف تتجنبها</h3><ul><li>البدء في الحل قبل فهم المطلوب: اقرأ السؤال وحدد الكلمات المفتاحية.</li><li>حفظ المثال دون فهم القاعدة: أعد حل المثال من البداية دون النظر إلى الحل.</li><li>إهمال التحقق من النتيجة: راجع الخطوات واختبر ما إذا كانت النتيجة منطقية.</li><li>استخدام مصطلحات غير دقيقة: اكتب تعريفًا مختصرًا ثم ادعمه بمثال.</li></ul>
 <h3>خامسًا: خلاصة للمراجعة</h3><div class="callout"><ul><li>افهم معنى الموضوع ومصطلحاته.</li><li>اربط القاعدة بخطوات عملية واضحة.</li><li>تدرّب على مثال جديد غير المثال المعروض.</li><li>أجب عن الأسئلة ثم راجع الإجابات النموذجية.</li></ul></div>
 <h3>سادسًا: تدريب ذاتي</h3><p>اكتب تعريفًا للموضوع، واذكر فائدتين له، ثم صمّم مثالًا من واقع الدراسة أو الحياة. قارن إجابتك بالإجابة النموذجية في بنك الأسئلة، ووسّع المثال كلما احتجت إلى بيانات إضافية.</p>

 </article><h2 class="section-title">بنك أسئلة المحاضرة — 20 سؤالًا</h2><p class="muted">يمكنك حل الاختيار من متعدد والصح والخطأ، وفتح الإجابة النموذجية للأسئلة المقالية.</p>
 <div id="quiz">${l.questions.map((q,qi)=>renderQuestion(q,qi)).join('')}</div><button class="btn" onclick="gradeQuiz(${si},${li})">تصحيح الأسئلة الموضوعية</button> <button class="btn secondary" onclick="showAnswers()">عرض كل الإجابات النموذجية</button><div id="score"></div>`;
}
function renderQuestion(q,qi){
 let options=q[2],ans=q[3];
 return `<div class="q" data-q="${qi}"><strong>${qi+1}. (${esc(q[0])})</strong><p>${esc(q[1])}</p>${options?options.map((o,oi)=>`<label><input type="radio" name="q${qi}" value="${oi}">${esc(o)}</label>`).join(''):''}<button class="btn secondary" onclick="toggleAnswer(${qi})">إظهار الإجابة النموذجية</button><div class="answer" id="ans${qi}"><strong>الإجابة النموذجية:</strong> ${options?esc(options[ans]):esc(ans)}</div></div>`;
}
function toggleAnswer(i){document.getElementById('ans'+i)?.classList.toggle('show')}
function showAnswers(){document.querySelectorAll('.answer').forEach(a=>a.classList.add('show'))}
function gradeQuiz(si,li){
 const qs=DATA[si].lectures[li].questions;let score=0,count=0;
 qs.forEach((q,i)=>{if(q[2]){count++;let picked=document.querySelector(`input[name="q${i}"]:checked`);if(picked&&Number(picked.value)===q[3])score++;}});
 const el=document.getElementById('score');el.className='score';el.textContent=`نتيجتك في الأسئلة الموضوعية: ${score} من ${count}. راجع الإجابات النموذجية، ثم أعد المحاولة لتحسين فهمك.`;
}
function toggleDone(key,si,li){if(state.done.includes(key))state.done=state.done.filter(x=>x!==key);else state.done.push(key);save();lessonPage(si,li)}
function questionBank(si=null,li=null){
 let list=[];
 DATA.forEach((s,i)=>{if(si!==null&&i!==si)return;s.lectures.forEach((l,j)=>{if(li!==null&&j!==li)return;list.push({s,i,l,j})})});
 app.innerHTML=`<div class="backrow"><button class="btn secondary" onclick="subjectsPage()">← المواد</button></div><section class="hero"><h2>بنك الأسئلة والإجابات النموذجية</h2><p>الأسئلة موزعة على المحاضرات. اختر مادة ومحاضرة لتصفية البنك.</p><div class="toolbar"><select id="filterSub" onchange="filterBank()"><option value="">كل المواد</option>${DATA.map((s,i)=>`<option value="${i}" ${si===i?'selected':''}>${esc(s.name)}</option>`).join('')}</select><select id="filterLec" onchange="filterBank()"><option value="">كل المحاضرات</option></select></div></section><div id="bankResults">${bankCards(list)}</div>`;
 updateLectureFilter(si,li);
}
function bankCards(list){return list.map(({s,i,l,j})=>`<article class="card" style="margin-bottom:12px"><h3>${esc(s.name)} — ${j+1}. ${esc(l.title)}</h3><p class="muted">20 سؤالًا وإجابة نموذجية</p><button class="btn" onclick="lessonPage(${i},${j});setTimeout(showAnswers,50)">عرض الأسئلة والإجابات</button></article>`).join('')}
function updateLectureFilter(si,li){let sub=document.getElementById('filterSub'),lec=document.getElementById('filterLec');if(!sub||!lec)return;let v=sub.value;lec.innerHTML='<option value="">كل المحاضرات</option>';if(v!==''){DATA[Number(v)].lectures.forEach((l,j)=>lec.innerHTML+=`<option value="${j}" ${li===j?'selected':''}>${j+1}. ${esc(l.title)}</option>`)}}
function filterBank(){let sub=document.getElementById('filterSub').value,lec=document.getElementById('filterLec').value;updateLectureFilter(sub===''?null:Number(sub),lec===''?null:Number(lec));sub=document.getElementById('filterSub').value;lec=document.getElementById('filterLec').value;let list=[];DATA.forEach((s,i)=>{if(sub!==''&&i!==Number(sub))return;s.lectures.forEach((l,j)=>{if(lec!==''&&j!==Number(lec))return;list.push({s,i,l,j})})});document.getElementById('bankResults').innerHTML=bankCards(list)}
function searchAll(q){const box=document.getElementById('searchResults');if(!box)return;if(!q.trim()){box.innerHTML='';return}let out=[];DATA.forEach((s,i)=>{s.lectures.forEach((l,j)=>{if((s.name+' '+l.title).includes(q.trim()))out.push(`<div class="lesson"><span>${esc(s.name)} — ${esc(l.title)}</span><button class="btn" onclick="lessonPage(${i},${j})">فتح</button></div>`)})});box.innerHTML=out.length?`<h3>نتائج البحث (${out.length})</h3><div class="lesson-list">${out.join('')}</div>`:'<p class="muted">لا توجد نتائج مطابقة.</p>'}
function profilePage(){app.innerHTML=`<section class="hero"><h2>ملف الطالب</h2><p class="muted">احفظ بياناتك على هذا الجهاز فقط. لن تُرسل إلى خادم.</p><div class="profile"><label>اسم الطالب<input class="field" id="studentName" value="${esc(state.name)}" placeholder="اكتب اسمك"></label><label>الفرقة الدراسية<input class="field" value="الفرقة الأولى" disabled></label><label>رقم الجلوس (اختياري)<input class="field" id="studentId" value="${esc(state.studentId)}" placeholder="رقم الجلوس"></label></div><p><button class="btn" onclick="saveProfile()">حفظ البيانات</button></p><h3>تقدمك الدراسي</h3><p>${doneCount()} من ${totalLectures()} محاضرة (${progress()}%)</p><div class="progress"><span style="width:${progress()}%"></span></div><button class="btn secondary" onclick="home()">العودة للرئيسية</button></section>`}
function saveProfile(){state.name=document.getElementById('studentName').value.trim();state.studentId=document.getElementById('studentId').value.trim();save();profilePage()}
function aboutPage(){app.innerHTML=`<section class="hero"><h2>عن الأكاديمية التعليمية</h2><p>موقع تعليمي تجريبي منظم للفرقة الأولى، يضم 7 مواد و70 عنوان محاضرة، مع أمثلة وتدريبات وبنك أسئلة.</p><div class="callout"><strong>تنبيه علمي مهم:</strong> المحتوى الحالي شرح تأسيسي للمذاكرة وليس بديلًا عن كتاب المقرر أو توصيف الجامعة. يجب مراجعة المصطلحات والتفاصيل مع محاضرات المدرس والمراجع المعتمدة، خصوصًا في اللغة الأوروبية التي قد تختلف حسب اللغة المطلوبة.</div><p>يُحفظ التقدم وملف الطالب محليًا في المتصفح على الجهاز نفسه، وقد يضيع عند مسح بيانات المتصفح أو استخدام جهاز آخر.</p><button class="btn" onclick="home()">الرئيسية</button></section>`}
home();
</script>
