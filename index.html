"يدرس علم الاقتصاد كيفية استخدام الموارد المحدودة لإشباع حاجات متعددة. ويركز الاقتصاد الجزئي على قرارات المستهلكين والمنتجين والأسواق المحددة، مثل سوق سلعة معينة. وتظهر المشكلة الاقتصادية لأن الموارد ليست كافية لإنتاج كل ما يرغب الناس فيه، ولذلك يجب الاختيار وترتيب الأولويات. تساعد المفاهيم الاقتصادية على تفسير الأسعار والكميات وكيفية توزيع الموارد.",

"العرض هو الكميات التي يرغب المنتجون في بيعها ويستطيعون توفيرها عند أسعار مختلفة خلال فترة معينة. غالبًا ما يشجع ارتفاع السعر المنتجين على عرض كمية أكبر إذا بقيت العوامل الأخرى ثابتة. ويتأثر العرض بتكاليف الإنتاج والتكنولوجيا والضرائب والإعانات وعدد المنتجين والتوقعات. تغير تكلفة المدخلات قد يحرك منحنى العرض حتى لو لم يتغير سعر السلعة نفسها.",
"يتحقق توازن السوق عندما تتساوى الكمية المطلوبة مع الكمية المعروضة. إذا كان السعر أعلى من سعر التوازن قد يظهر فائض في العرض، وإذا كان أقل منه قد تظهر زيادة في الكمية المطلوبة مقارنة بالمعروضة. تؤدي تغيرات الطلب أو العرض إلى تغير سعر التوازن وكميته. ويُستخدم مفهوم التوازن لتفسير كيفية استجابة السوق للتغيرات.",
"تقيس المرونة مدى استجابة الكمية المطلوبة أو المعروضة لتغير السعر أو الدخل أو عامل آخر. تتأثر مرونة الطلب بتوافر البدائل وأهمية السلعة ونسبة الإنفاق والوقت المتاح للتكيف. إذا استجابت الكمية بدرجة كبيرة كان الطلب أكثر مرونة، وإذا كانت الاستجابة محدودة كان أقل مرونة. وتفيد المرونة في فهم سلوك المستهلكين وقرارات التسعير.",
"يدرس سلوك المستهلك كيفية توزيع دخله المحدود على السلع والخدمات لتحقيق أكبر إشباع ممكن. تؤثر التفضيلات والأسعار والدخل والبدائل في قرارات الشراء. ويوازن المستهلك بين المنافع التي يتوقعها والتكلفة التي يتحملها. ولا يعني النموذج أن جميع المستهلكين يتصرفون بالطريقة نفسها؛ فالقرارات تتأثر بالمعلومات والعادات والظروف الشخصية.",

"تختلف الأسواق حسب عدد البائعين والمشترين وطبيعة السلعة وسهولة دخول السوق وتوافر المعلومات. في المنافسة توجد منشآت عديدة، بينما قد يتمتع المحتكر بقوة سوقية أكبر. وتوجد أشكال أخرى مثل المنافسة الاحتكارية واحتكار القلة. تساعد دراسة هيكل السوق على فهم كيفية تحديد الأسعار وحجم الإنتاج ومدى المنافسة.",
"تجمع المراجعة مفاهيم الندرة والاختيار وتكلفة الفرصة البديلة والطلب والعرض والتوازن والمرونة وسلوك المستهلك والإنتاج والتكاليف وهياكل السوق. عند حل سؤال اقتصادي، حدد المفهوم المطلوب، ثم حدد العوامل الثابتة والمتغيرة، وفسر اتجاه العلاقة قبل اختيار الإجابة."

"تشمل موارد التنمية الموارد الطبيعية والبشرية والمالية والمؤسسية. وجود الموارد وحده لا يكفي، إذ تحتاج إلى إدارة فعالة واستثمار مناسب وتعليم وبنية أساسية. ويمكن أن يؤدي سوء استخدام الموارد إلى الهدر أو الأضرار البيئية. لذلك ترتبط التنمية المستدامة بتحقيق منافع طويلة الأجل مع المحافظة على قدرة الأجيال القادمة.",
"يساعد الاستثمار في المعدات والمشروعات والبنية الأساسية على زيادة الطاقة الإنتاجية عندما يوجَّه إلى احتياجات حقيقية. ويحتاج الاستثمار إلى بيئة مناسبة تشمل المهارات والاستقرار والقواعد الواضحة وإمكانية الوصول إلى التمويل. كما ينبغي تقييم التكاليف والمنافع والمخاطر قبل تنفيذ المشروعات.",
"تؤثر التغيرات السكانية في حجم القوى العاملة والطلب على التعليم والصحة والسكن والخدمات. ويمكن أن يمثل السكان فرصة اقتصادية إذا توفرت لهم المهارات وفرص العمل، وقد يزيد الضغط على الموارد إذا لم تتطور الخدمات والبنية الأساسية بما يتناسب مع الاحتياجات.",
"يسهم التعليم والتدريب والصحة في بناء رأس المال البشري، أي المهارات والمعارف والقدرات التي تساعد الفرد على الإنتاج والمشاركة في المجتمع. وقد ترفع جودة التعليم الإنتاجية والابتكار، لكن النتائج تعتمد أيضًا على توفر فرص عمل ملائمة ومؤسسات قادرة على الاستفادة من المهارات.",
"يمكن للتكنولوجيا أن تزيد الإنتاجية وتحسن جودة المنتجات وتقلل الهدر وتفتح أسواقًا جديدة. لكن تبني التكنولوجيا يحتاج إلى تدريب وبنية أساسية وتمويل وإدارة مناسبة. ومن المهم النظر في آثار التحول التكنولوجي على الوظائف والمهارات والبيئة.",
"الفقر وعدم المساواة مفهومان مرتبطان لكنهما ليسا الشيء نفسه. تدرس سياسات التنمية فرص العمل والخدمات الأساسية والحماية الاجتماعية وتحسين الوصول إلى التعليم والصحة. وتعتمد فاعلية السياسات على تصميمها وتمويلها وشفافية تنفيذها وتقييم نتائجها.",
"تربط المراجعة بين النمو والتنمية والموارد والاستثمار والسكان والتعليم والتكنولوجيا والفقر. عند تقييم سياسة تنموية، حدد المشكلة، والفئات المتأثرة، والموارد المطلوبة، والنتائج المتوقعة، ثم قارن النتائج الفعلية بالأهداف."
],
"أصول إدارة الأعمال":[
"الإدارة هي تنسيق جهود الأفراد والموارد لتحقيق أهداف المؤسسة بكفاءة وفاعلية. الكفاءة تعني استخدام الموارد بصورة جيدة، والفاعلية تعني تحقيق الأهداف المطلوبة. وتظهر الإدارة في المؤسسات التجارية والخدمية والعامة وغير الربحية. وتتطلب الإدارة تحديد الأهداف وفهم البيئة وتوزيع المسؤوليات ومتابعة النتائج.",
"تتكامل وظائف الإدارة الأربع: التخطيط يحدد الأهداف، والتنظيم يوزع المهام والموارد، والتوجيه يساعد الأفراد على التنفيذ، والرقابة تقارن النتائج بالخطط. ليست الوظائف منفصلة تمامًا؛ فقد يعود المدير إلى التخطيط عندما تكشف الرقابة عن تغير في الظروف أو مشكلة في التنفيذ.",
"التخطيط عملية تحديد الأهداف واختيار الوسائل والموارد والوقت اللازم لتحقيقها. ينبغي أن تكون الأهداف واضحة وقابلة للمتابعة، وأن تستند الخطط إلى معلومات واقعية. ويشمل التخطيط توقع المخاطر ووضع بدائل عند تغير الظروف. ويساعد التخطيط الجيد على تقليل الارتجال وتحسين استخدام الوقت والموارد.",
"التنظيم يحدد الأعمال المطلوبة والعلاقات بين الوظائف والصلاحيات والمسؤوليات. يساعد الوصف الواضح للمهام على تقليل الازدواجية والتعارض، كما يسهل التعاون وتبادل المعلومات. ويجب أن يتناسب الهيكل التنظيمي مع حجم المؤسسة وأهدافها وطبيعة أعمالها.",
"القيادة والتوجيه يتضمنان توضيح الأهداف وتحفيز العاملين ومساعدتهم على أداء مهامهم. تختلف أساليب القيادة بحسب الخبرة وطبيعة العمل والظروف. وتقوم القيادة الفعالة على التواصل الواضح والإنصاف والاستماع والمتابعة، وليس على إصدار الأوامر فقط.",
"الرقابة الإدارية تقيس الأداء الفعلي وتقارنه بمعايير محددة، ثم تحلل الانحرافات وتتخذ إجراءات تصحيحية. يمكن أن تكون الرقابة قبل التنفيذ أو أثناءه أو بعده. ويجب أن تعتمد على معلومات مناسبة، وأن تستخدم لتحسين الأداء وحل المشكلات لا لمجرد لوم الأفراد.",
"اتخاذ القرار يبدأ بتحديد المشكلة بدقة، ثم جمع المعلومات وتحديد البدائل ومقارنة تكاليفها ومنافعها ومخاطرها. بعد الاختيار يجب تنفيذ القرار ومتابعة نتائجه. وقد تكون المعلومات غير مكتملة، لذلك يحتاج المدير إلى تقدير المخاطر والاستعداد لتعديل القرار عند ظهور معلومات جديدة.",
"التحفيز هو العوامل التي تشجع الأفراد على بذل الجهد والاستمرار. قد يكون التحفيز ماليًا أو معنويًا، مثل التقدير وفرص التعلم وتحمل المسؤولية. لا يناسب أسلوب واحد جميع العاملين، لذلك ينبغي فهم احتياجات الفريق وربط التقدير بالأداء والسلوك المهني.",
"الاتصال الإداري نقل المعلومات والأفكار والتعليمات بين الأفراد والوحدات. يتطلب الاتصال الجيد رسالة واضحة ووسيلة مناسبة وفرصة للتغذية الراجعة. وقد تعيق الاتصال المصطلحات الغامضة أو كثرة المعلومات أو ضعف الاستماع. يساعد الاتصال الفعال على تقليل الأخطاء وتنسيق الجهود.",
"تجمع المراجعة التخطيط والتنظيم والقيادة والرقابة واتخاذ القرار والتحفيز والاتصال. عند تحليل موقف إداري، حدد الهدف والمشكلة والموارد والأشخاص المعنيين، ثم اختر الوظيفة الإدارية المناسبة وطريقة متابعة النتائج."
],
"الرياضيات البحتة":[
"تضم مجموعات الأعداد الطبيعية والصحيحة والنسبية والحقيقية. العدد الطبيعي يستخدم في العد، والصحيح يشمل السالب والصفر والموجب، والنسبي يمكن كتابته في صورة كسر من عددين صحيحين مقامه لا يساوي صفرًا. فهم نوع العدد يساعد على تحديد العمليات والقواعد المناسبة.",
"تحتاج العمليات الحسابية إلى مراعاة ترتيب العمليات والإشارات والأقواس. تُجرى العمليات داخل الأقواس أولًا، ثم الأسس، ثم الضرب والقسمة، ثم الجمع والطرح وفق القواعد المتعارف عليها. ومن المفيد التحقق من النتيجة بالتقدير أو بإعادة الحساب بطريقة أخرى.",
"المعادلة الخطية مساواة تحتوي على متغير من الدرجة الأولى. لحلها نعزل المتغير بإجراء العملية نفسها على الطرفين. مثلًا، إذا كان س + ٣ = ٧، نطرح ٣ من الطرفين فنحصل على س = ٤. بعد الحل، نعوض بالقيمة في المعادلة الأصلية للتأكد من صحتها.",
"المعادلة التربيعية تحتوي على متغير مرفوع للقوة الثانية. يمكن حلها بالتحليل إلى عوامل أو إكمال المربع أو استخدام القانون العام. يعتمد اختيار الطريقة على شكل المعادلة. ويجب الانتباه إلى إشارات الحدود وترتيب المعادلة قبل بدء الحل.",
"المتباينة تقارن بين مقدارين باستخدام رموز مثل أكبر من وأقل من وأكبر من أو يساوي. يمكن حلها بخطوات مشابهة للمعادلات، لكن عند الضرب أو القسمة في عدد سالب يجب عكس اتجاه الإشارة. وتمثل مجموعة الحل أحيانًا على خط الأعداد.",
"الدالة علاقة تربط كل قيمة إدخال مسموحة بقيمة إخراج واحدة. من مفاهيمها المجال والمدى والمتغير المستقل والمتغير التابع. يمكن تمثيل الدالة بجدول أو رسم بياني أو قاعدة جبرية. ويساعد فهم الدوال على وصف العلاقات بين الكميات.",
"الأسس تمثل تكرار ضرب العدد في نفسه، والجذور ترتبط بالأسس بوصفها عمليات عكسية في الحالات المناسبة. عند تبسيط التعبيرات يجب مراعاة قواعد الأسس وشروط المجال، وعدم تطبيق قاعدة على جمع أو طرح عندما لا تكون صالحة.",
"المصفوفة ترتيب مستطيل من الأعداد في صفوف وأعمدة. يمكن جمع مصفوفتين من الأبعاد نفسها، كما يتطلب الضرب توافق عدد أعمدة المصفوفة الأولى مع عدد صفوف الثانية. ضرب المصفوفات ليس تبادليًا في العموم، ولذلك يجب الالتزام بترتيب العملية.",
"المتتابعة قائمة مرتبة من الحدود وفق قاعدة. في المتتابعة الحسابية يكون الفرق بين كل حدين متتاليين ثابتًا، وفي الهندسية تكون النسبة ثابتة إذا كانت معرفة. يساعد تحديد النمط على إيجاد الحدود التالية أو صيغة الحد العام.",
"تجمع المراجعة مجموعات الأعداد والعمليات والمعادلات والمتباينات والدوال والأسس والمصفوفات والمتتابعات. اكتب خطوات الحل بوضوح، وراجع الإشارات، وتحقق من الناتج بالتعويض أو بطريقة بديلة متى أمكن."
],
"اللغة الأوروبية":[
"تساعد التحيات على بدء الحديث بطريقة مهذبة. تختلف الصيغة بحسب الوقت والموقف ودرجة الرسمية. من المفيد حفظ العبارات في سياق محادثة قصيرة والتدرب على النطق والاستماع، مع الانتباه إلى أن المفردات قد تختلف بين الإنجليزية وغيرها من اللغات الأوروبية.",
"يتضمن التعريف بالنفس تقديم الاسم والدراسة والعمل والاهتمامات باستخدام جمل بسيطة. ينبغي اختيار معلومات مناسبة للموقف، والتحدث بوضوح، والاستماع إلى الطرف الآخر. تساعد الممارسة المتكررة على بناء الثقة وتذكر المفردات.",
"الضمائر الشخصية تحل محل الأسماء وتحدد المتحدث أو المخاطب أو الشخص المشار إليه. في الإنجليزية مثلًا تشمل I وyou وhe وshe وit وwe وthey. وقد يتغير شكل الفعل وفق الضمير والزمن، لذلك من المهم مراجعة الضمائر داخل جمل.",
"الأفعال تعبّر عن حدث أو حالة، وتتغير صيغها بحسب الزمن والفاعل في كثير من اللغات. في الإنجليزية توجد أفعال شائعة مثل be وhave وdo. تعلم الفعل داخل جملة يساعد على فهم استخدامه بدل حفظ معناه منفردًا.",
"الأسماء تسمي الأشخاص والأشياء والأماكن والأفكار، بينما تضيف الصفات معلومات عن الأسماء. يختلف ترتيب الصفة والاسم بحسب اللغة. وتساعد قراءة أمثلة متعددة على فهم ترتيب الكلمات واستخدام المفرد والجمع.",
"تحتاج الجملة إلى ترتيب مناسب للكلمات وفق قواعد اللغة المستهدفة. في الجملة الإنجليزية البسيطة يأتي الفاعل غالبًا قبل الفعل، وقد يأتي بعده مفعول أو متمم. يجب الانتباه إلى النفي والسؤال وعلامات الترقيم وعدم الاعتماد على الترجمة الحرفية.",
"توضح الأزمنة علاقة الحدث بالوقت، مثل الحاضر والماضي والمستقبل. اختيار الزمن يتوقف على معنى الجملة والسياق. تساعد الأمثلة المقارنة على تمييز الحدث المعتاد من الحدث الجاري أو المنتهي، ويجب مراجعة الصيغ والتعبيرات الزمنية.",
"تتضمن مفردات الأعمال كلمات مثل price وinvoice وmeeting وcustomer في الإنجليزية. تعلم الكلمة ضمن جملة أو موقف تجاري يساعد على فهمها وتذكرها. من المفيد التدريب على قراءة رسائل قصيرة وفهم الأسعار والمواعيد وطلبات العملاء.",
"يتطلب فهم النص تحديد الفكرة العامة أولًا، ثم البحث عن الكلمات المفتاحية والتفاصيل. لا يلزم فهم كل كلمة منفردة للوصول إلى المعنى العام، إذ يساعد السياق على استنتاج بعض المعاني. بعد القراءة، يمكن تلخيص الفكرة والإجابة عن أسئلة الفهم.",
"تجمع المراجعة التحيات والتعريف بالنفس والضمائر والأفعال وتركيب الجملة والأزمنة ومفردات الأعمال. اجعل المذاكرة قائمة على القراءة والاستماع والكتابة والمحادثة، وتحقق من قواعد اللغة المقررة في منهجك."
],
"الصحة والسلامة":[
"تهدف الصحة والسلامة إلى حماية الأفراد وتقليل المخاطر في أماكن الدراسة والعمل. وتشمل الوقاية والتدريب وتحديد مصادر الضرر وتوفير بيئة مناسبة والإبلاغ عن المشكلات. تعتمد السلامة على مسؤولية مشتركة بين الإدارة والأفراد، وعلى اتباع التعليمات المعتمدة.",
"يبدأ تحديد المخاطر بملاحظة مصدر محتمل للضرر، ثم تقدير احتمال وقوعه وشدة أثره. بعد ذلك تُختار إجراءات للسيطرة عليه، مثل إزالة الخطر أو عزل مصدره أو استخدام وسائل حماية مناسبة. يجب مراجعة التقييم عندما تتغير ظروف العمل أو تظهر معلومات جديدة.",
"تقل الحوادث عندما تُتبع الإجراءات الصحيحة وتُصان المعدات وتظل الممرات خالية من العوائق. ينبغي الإبلاغ عن الظروف غير الآمنة وعدم استخدام أدوات تالفة. كما تساعد التوعية والتدريب وتسجيل الحوادث القريبة من الوقوع على منع تكرارها.",
"تتطلب السلامة الكهربائية عدم لمس الأسلاك المكشوفة أو الأجهزة التالفة، وعدم تحميل المقابس بما يتجاوز قدرتها. يجب إبلاغ المختصين عن الأعطال وعدم محاولة إصلاح الكهرباء دون تدريب وتأهيل. كما ينبغي اتباع تعليمات المنشأة بشأن فصل الطاقة عند الحاجة.",
"تشمل الوقاية من الحرائق المحافظة على المخارج خالية، وتخزين المواد بطريقة مناسبة، وعدم تجاهل الإنذارات. عند حدوث حريق يجب اتباع خطة الطوارئ وإخلاء المكان وفق التعليمات. لا تحاول مكافحة حريق إذا كان ذلك يعرضك للخطر، واطلب المساعدة المختصة.",
"الإسعافات الأولية مساعدة أولية آمنة للمصاب حتى وصول المختصين. يجب تقييم سلامة المكان أولًا وطلب خدمات الطوارئ عند الحاجة. لا تنفذ إجراءً لا تعرفه أو قد يسبب ضررًا، واتبع التدريب والإرشادات المحلية المعتمدة.",
"تدعم النظافة الشخصية ونظافة مكان العمل الوقاية من العدوى والحفاظ على الصحة. يشمل ذلك غسل اليدين عند الحاجة، وتنظيف الأسطح وفق التعليمات، والتخلص الآمن من المخلفات، وتوفير التهوية والمياه النظيفة والمرافق المناسبة.",
"تُختار معدات الوقاية الشخصية بحسب نوع الخطر، مثل القفازات أو النظارات أو الخوذة أو وسائل حماية السمع. يجب أن تكون المعدات مناسبة للمستخدم وفي حالة جيدة، وأن تستخدم وفق التدريب. ولا تغني معدات الوقاية عن إزالة الخطر أو تقليله من المصدر.",
"في الطوارئ ينبغي الحفاظ على الهدوء واتباع الإنذارات ومسارات الإخلاء وتعليمات المسؤولين. يجب معرفة مخارج الطوارئ ونقاط التجمع مسبقًا. لا تعُد إلى منطقة خطرة حتى يصدر تصريح بذلك من المسؤولين المختصين.",
"تجمع المراجعة تحديد المخاطر والوقاية من الحوادث والسلامة الكهربائية والحرائق والإسعافات والنظافة ومعدات الوقاية والاستجابة للطوارئ. تعتمد السلامة على الوقاية والتدريب والإبلاغ واتباع التعليمات الرسمية."
]};

let currentSubject="",currentLesson=0,examMode="lesson",currentQuestions=[];

function el(id){return document.getElementById(id)}
function showPage(id){
["home","lessonsPage","lecturePage","examPage"].forEach(x=>el(x).classList.add("hidden"));
el(id).classList.remove("hidden");
}
function goHome(){showPage("home")}
function goLessons(){showPage("lessonsPage")}

function init(){
el("subjectList").innerHTML=subjects.map((s,i)=>
`<div class="card"><h3>${s}</h3><p>10 محاضرات واختبارات</p>
<button onclick="openSubject(${i})">عرض المادة</button></div>`).join("");
}
function openSubject(i){
currentSubject=subjects[i];
showPage("lessonsPage");
el("subjectHeading").textContent=currentSubject;
el("lessonList").innerHTML=titles[currentSubject].map((t,j)=>
`<div class="card"><span class="tag">المحاضرة ${j+1}</span><h3>${t}</h3>
<button onclick="openLecture(${j})">فتح المحاضرة</button></div>`).join("");
}
function openLecture(i){
currentLesson=i;
showPage("lecturePage");
const title=titles[currentSubject][i];
const text=details[currentSubject][i];
el("lectureContent").innerHTML=`
<span class="tag">${currentSubject}</span>
<h2>المحاضرة ${i+1}: ${title}</h2>
<h3>الشرح التفصيلي</h3><p>${text}</p>
<h3>مثال وتطبيق</h3><p>${example(currentSubject,i)}</p>
<h3>أهم النقاط للمراجعة</h3>
<ul><li>افهم تعريف الموضوع ومصطلحاته الأساسية.</li>
<li>اربط الفكرة بالمثال الموضح في المحاضرة.</li>
<li>راجع أسباب الموضوع ونتائجه أو خطوات تطبيقه بحسب المادة.</li>
<li>حل الأسئلة بنفسك قبل الاطلاع على الإجابات.</li></ul>
<div class="card"><b>ملخص المحاضرة</b><p>${text.slice(0,Math.min(420,text.length))}</p></div>`;
}
function example(s,i){
const ex={
"أصول المحاسبة المالية":"مثال: إذا أودع صاحب المنشأة رأس مال نقديًا، تزيد النقدية وتزيد حقوق الملكية بالمبلغ نفسه. وإذا اشترت المنشأة أدوات نقدًا، يجب تحليل الحسابات التي زادت أو نقصت قبل تسجيل القيد.",
"مبادئ الاقتصاد الجزئي":"مثال: إذا ارتفع سعر سلعة مع ثبات العوامل الأخرى، فقد تنخفض الكمية المطلوبة. أما إذا تغير دخل المستهلكين فقد يتغير الطلب كله.",
"اقتصاديات التطور":"مثال: الاستثمار في التدريب والبنية الأساسية قد يرفع مهارات العاملين وقدرة المنشآت على الإنتاج، بشرط حسن التخطيط والتنفيذ.",
"أصول إدارة الأعمال":"مثال: تحديد هدف للمبيعات، ثم توزيع المهام على الموظفين، ومتابعة النتائج، يمثل تطبيقًا مترابطًا للتخطيط والتنظيم والرقابة.",
"الرياضيات البحتة":"مثال: لحل س + ٣ = ٧ نطرح ٣ من الطرفين، فنحصل على س = ٤. بالتعويض: ٤ + ٣ = ٧، إذن الحل صحيح.",
"اللغة الأوروبية":"مثال: عند التعريف بالنفس استخدم جملًا قصيرة، ثم راجع ترتيب الكلمات والضمائر والفعل المناسب وفق قواعد اللغة التي تدرسها.",
"الصحة والسلامة":"مثال: إبقاء ممر الخروج خاليًا من الصناديق، والإبلاغ عن الأسلاك التالفة، يساعد على تقليل المخاطر."
};
return ex[s];
}

function buildQuestions(subject,lesson,count){
const topic=titles[subject][lesson];
const banks={
"أصول المحاسبة المالية":[
["ما الهدف الأساسي للمحاسبة المالية؟",["تسجيل وتلخيص العمليات المالية","توقع الطقس","تصميم المباني"],0],
["المعادلة المحاسبية الأساسية هي:",["الأصول = الخصوم + حقوق الملكية","الأصول = الإيرادات فقط","الخصوم = المصروفات فقط"],0],
["دفتر اليومية يرتب العمليات حسب:",["تاريخ حدوثها","حجم المبنى","أسماء العملاء أبجديًا فقط"],0],
["ميزان المراجعة يساعد على فحص:",["تساوي الأرصدة المدينة والدائنة","درجات الحرارة","عدد الموظفين فقط"],0],
["قائمة المركز المالي تعرض:",["الأصول والخصوم وحقوق الملكية","الطقس اليومي","خطة الدعاية فقط"],0]
],
"مبادئ الاقتصاد الجزئي":[
["ماذا يدرس الاقتصاد الجزئي؟",["سلوك المستهلكين والمنتجين والأسواق","الكواكب فقط","قواعد اللغة فقط"],0],
["تكلفة الفرصة البديلة هي:",["قيمة أفضل بديل تم التخلي عنه","إجمالي السكان","سعر كل السلع مجتمعة"],0],
["الطلب يعبر عن:",["الكميات التي يرغب ويستطيع المستهلك شراءها","كمية الأمطار","عدد المصانع فقط"],0],
["يتحقق توازن السوق عندما:",["تتساوى الكمية المطلوبة والمعروضة","ينعدم الطلب دائمًا","يكون السعر صفرًا دائمًا"],0],
["تكاليف الإنتاج تشمل:",["التكاليف الثابتة والمتغيرة","الأذواق فقط","عدد المشترين فقط"],0]
],
"اقتصاديات التطور":[
["التنمية الاقتصادية تهدف إلى:",["تحسين الإنتاجية ومستوى المعيشة","منع التعليم","تقليل كل فرص العمل"],0],
["النمو الاقتصادي يرتبط أساسًا بزيادة:",["الناتج الحقيقي","عدد العطلات فقط","عدد الأسماء"],0],
["من موارد التنمية:",["الموارد البشرية والمالية والطبيعية","المعلومات العشوائية فقط","المخاطر فقط"],0],
["يساعد التعليم على بناء:",["رأس المال البشري","المخزون التالف","الديون وحدها"],0],
["يمكن للتكنولوجيا أن تسهم في:",["رفع الإنتاجية عند حسن استخدامها","إلغاء الحاجة لكل المهارات","منع كل أنواع الإنتاج"],0]
],
"أصول إدارة الأعمال":[
["من وظائف الإدارة:",["التخطيط والتنظيم والتوجيه والرقابة","التخمين فقط","إهمال الأهداف"],0],
["التخطيط يهتم بـ:",["تحديد الأهداف والوسائل","إخفاء المسؤوليات","إلغاء المتابعة"],0],
["التنظيم يوضح:",["المهام والمسؤوليات والصلاحيات","حالة الطقس","أسعار العملات فقط"],0],
["الرقابة تقارن الأداء بـ:",["المعايير والأهداف","الأسماء فقط","الرغبات غير المحددة"],0],
["اتخاذ القرار يتطلب:",["دراسة البدائل والنتائج المحتملة","اختيارًا عشوائيًا دائمًا","تجاهل المعلومات"],0]
],
"الرياضيات البحتة":[
["إذا كان س + ٣ = ٧ فإن س =",["٤","٣","١٠"],0],
["٢ × ٥ يساوي:",["١٠","٧","٣"],0],
["مربع العدد ٤ هو:",["١٦","٨","١٢"],0],
["إذا كان س = ٢ فإن س + ٥ =",["٧","٣","١٠"],0],
["عند ضرب طرفي متباينة في عدد سالب:",["تنعكس إشارة المتباينة","لا تتغير أبدًا","تتحول إلى مساواة"],0]
],
"اللغة الأوروبية":[
["التحيات تستخدم عادةً من أجل:",["بدء التواصل بأدب","إيقاف كل محادثة","حل معادلة"],0],
["التعريف بالنفس يتضمن:",["معلومات مناسبة عن الشخص","قائمة أسعار فقط","أرقامًا بلا سياق"],0],
["الضمائر الشخصية تحل محل:",["الأسماء","علامات الترقيم","الأرقام فقط"],0],
["الأفعال تدل على:",["حدث أو حالة","مكان فقط دائمًا","لون فقط"],0],
["فهم النص يعتمد على:",["الفكرة العامة والتفاصيل والسياق","تجاهل كل الكلمات","قراءة العنوان فقط"],0]
],
"الصحة والسلامة":[
["الهدف من السلامة المهنية هو:",["تقليل المخاطر وحماية الأفراد","زيادة الحوادث","إغلاق المخارج"],0],
["عند ملاحظة خطر ينبغي:",["الإبلاغ عنه واتباع الإجراءات","تجاهله","إخفاؤه"],0],
["ممرات الإخلاء يجب أن تكون:",["خالية من العوائق","مغلقة بالأغراض","غير معروفة"],0],
["عند وجود سلك كهربائي تالف يجب:",["الابتعاد وإبلاغ المختص","لمسه مباشرة","محاولة إصلاحه دون تدريب"],0],
["معدات الوقاية الشخصية يجب أن تكون:",["مناسبة للخطر وتستخدم وفق التعليمات","غير مناسبة","بديلًا عن كل إجراءات الوقاية"],0]
]};
const mc=banks[subject];
const reasons=[
["بم تفسر أهمية دراسة "+topic+"؟","لأنها تساعد على فهم المفاهيم المرتبطة بالموضوع وتطبيقها في المواقف المناسبة."],
["بم تفسر ضرورة فهم المصطلحات الأساسية في "+topic+"؟","لأن فهم المصطلحات يمنع الخلط بين المفاهيم ويساعد على تفسير المعلومات بدقة."],
["بم تفسر أهمية مراجعة أمثلة "+topic+"؟","لأن الأمثلة تربط المعرفة النظرية بالتطبيق وتوضح خطوات التفكير."],
["بم تفسر ضرورة التحقق من النتائج عند دراسة "+topic+"؟","لأن التحقق يساعد على اكتشاف الأخطاء والتأكد من سلامة الاستنتاج أو الحل."],
["بم تفسر ارتباط "+topic+" ببقية موضوعات المادة؟","لأن موضوعات المادة تتكامل، وفهم الأساس يساعد على استيعاب الموضوعات التالية."]
];
const completions=[
["أكمل: تساعد دراسة "+topic+" على ________.","فهم المفاهيم وتطبيقها في سياقها الصحيح."],
["أكمل: من المهم عند دراسة "+topic+" فهم ________.","التعريفات والمصطلحات الأساسية."],
["أكمل: تساعد الأمثلة التطبيقية على ________.","توضيح الفكرة النظرية."],
["أكمل: ينبغي مراجعة الأخطاء من أجل ________.","معرفة أسبابها وتصحيحها."],
["أكمل: من وسائل تثبيت المعلومات ________.","المراجعة وحل الأسئلة والتطبيق."]
];
const shortQs=[
["عرّف "+topic+".","هو موضوع يشرح المفاهيم والمبادئ الأساسية المرتبطة بهذا العنوان، ويُدرس وفق تعريفاته وقواعده في المقرر."],
["اذكر فائدتين من دراسة "+topic+".","فهم المصطلحات الأساسية، والقدرة على تفسير الأمثلة أو تطبيق القواعد المتعلقة بالموضوع."],
["وضح الفكرة الرئيسية في "+topic+".","تتمثل الفكرة الرئيسية في فهم طبيعة الموضوع وعناصره والعلاقات التي تربط بينها."],
["اذكر مثالًا مناسبًا على "+topic+".","يُقبل مثال صحيح يرتبط مباشرة بالمفهوم الوارد في شرح المحاضرة مع توضيح سبب ارتباطه به."],
["اكتب ملخصًا قصيرًا عن "+topic+".","يُكتب الملخص بذكر التعريف، وأهم العناصر أو الخطوات، ثم فائدة الموضوع أو تطبيقه."]
];
let result=[];
for(let i=0;i<5;i++){
let q=mc[i%mc.length];
result.push({type:"اختيار من متعدد",q:q[0],options:q[1],answer:q[2]});
}
for(let i=0;i<5;i++)result.push({type:"بم تفسر",q:reasons[i][0],model:reasons[i][1]});
for(let i=0;i<5;i++)result.push({type:"أكمل",q:completions[i][0],model:completions[i][1]});
for(let i=0;i<5;i++)result.push({type:"أسئلة قصيرة",q:shortQs[i][0],model:shortQs[i][1]});
return result.slice(0,count);
}

function startLectureExam(){
examMode="lesson";
questionsNow=buildQuestions(currentSubject,currentLesson,20);
renderExam("اختبار المحاضرة: "+titles[currentSubject][currentLesson]);
}
function startSubjectExam(){
examMode="subject";
questionsNow=[];
for(let i=0;i<10;i++)questionsNow.push(...buildQuestions(currentSubject,i,20));
renderExam("الاختبار الشامل لمادة: "+currentSubject);
}
function renderExam(title){
showPage("examPage");
el("examContent").innerHTML=`<h2>${title}</h2>
<p>الاختبار مقسم إلى 5 اختيار من متعدد، و5 بم تفسر، و5 أكمل، و5 أسئلة قصيرة.</p>
<form id="examForm">
${questionsNow.map((q,i)=>`
<div class="card">
<span class="tag">${q.type}</span>
<h3>${i+1}. ${q.q}</h3>
${q.options?q.options.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}">${o}</label>`).join(""):`<textarea name="q${i}" placeholder="اكتب إجابتك هنا"></textarea>`}
<details><summary>عرض الإجابة النموذجية</summary><div class="answer">${q.options?q.options[q.answer]:q.model}</div></details>
</div>`).join("")}
<button type="button" onclick="gradeExam()">تصحيح الاختبار</button>
</form><div id="result"></div>`;
}
function gradeExam(){
let score=0,answered=0,autoCount=0;
questionsNow.forEach((q,i)=>{
if(q.options){
autoCount++;
const a=document.querySelector(`input[name="q${i}"]:checked`);
if(a){answered++;if(Number(a.value)===q.answer)score++}
}else{
const a=document.querySelector(`[name="q${i}"]`);
if(a&&a.value.trim())answered++;
}
});
const result=el("result");
if(answered<questionsNow.length){
result.className="bad";
result.textContent=`أكملت ${answered} من ${questionsNow.length} سؤالًا. أكمل الإجابات أولًا.`;
return;
}
result.className="good";
result.innerHTML=`<div class="card"><h2>تم تصحيح الاختبار</h2>
<p>درجتك في أسئلة الاختيار من متعدد: ${score} من ${autoCount}.</p>
<p>تم تسجيل إجاباتك المقالية. راجع الإجابات النموذجية لتقييم أسئلة «بم تفسر» و«أكمل» والأسئلة القصيرة.</p>
<p>عدد الأسئلة: ${questionsNow.length}</p>
<button onclick="backFromExam()">العودة</button></div>`;
}
function backFromExam(){
if(examMode==="lesson")showPage("lecturePage");
else showPage("lessonsPage");
}
init();
</script>
</body>
</html>
